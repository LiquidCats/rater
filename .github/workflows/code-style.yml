name: Code Style

permissions:
  contents: read

on:
  workflow_call:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Set Up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.0'

      - name: Check Out
        uses: actions/checkout@v6

      - name: Code Style Check
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10.1